name: Sync API Types

on:
  push:
    branches:
      - main
      - addingNewAPIs
    paths:
      - 'src/**/*.py'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  generate-types:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: earthquake_monitor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/earthquake_monitor
        run: |
          alembic upgrade head

      - name: Start FastAPI server in background
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/earthquake_monitor
        run: |
          cd src
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > fastapi.pid
          
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null; then
              echo "FastAPI server is ready"
              break
            fi
            echo "Waiting for FastAPI server... ($i/30)"
            sleep 2
          done

      - name: Download OpenAPI spec
        run: |
          curl -o openapi.json http://localhost:8000/openapi.json
          cat openapi.json | head -n 20

      - name: Stop FastAPI server
        run: |
          if [ -f src/fastapi.pid ]; then
            kill $(cat src/fastapi.pid) || true
            rm src/fastapi.pid
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate TypeScript types
        working-directory: frontend
        run: |
          npm run generate-api

      - name: Check for changes
        id: git-check
        run: |
          git add frontend/src/app/api/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in generated API types"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in generated API types"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update generated API types from OpenAPI spec"
          git push
