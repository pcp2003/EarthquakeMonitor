<div class="filters-section">
  <h2>Filters</h2>
  <div class="filter-grid">
    <div class="filter-group">
      <label for="min-magnitude">Min Magnitude:</label>
      <input
        type="number"
        id="min-magnitude"
        [value]="filters.min_magnitude || ''"
        (change)="onMinMagnitudeChange($event)"
        placeholder="e.g., 2.5"
        step="0.1"
      />
    </div>

    <div class="filter-group">
      <label for="max-magnitude">Max Magnitude:</label>
      <input
        type="number"
        id="max-magnitude"
        [value]="filters.max_magnitude || ''"
        (change)="onMaxMagnitudeChange($event)"
        placeholder="e.g., 9.0"
        step="0.1"
      />
    </div>

    <div class="filter-group">
      <label for="min-depth">Min Depth (km):</label>
      <input
        type="number"
        id="min-depth"
        [value]="filters.min_depth || ''"
        (change)="onMinDepthChange($event)"
        placeholder="e.g., 0"
        step="1"
      />
    </div>

    <div class="filter-group">
      <label for="max-depth">Max Depth (km):</label>
      <input
        type="number"
        id="max-depth"
        [value]="filters.max_depth || ''"
        (change)="onMaxDepthChange($event)"
        placeholder="e.g., 800"
        step="1"
      />
    </div>

    <div class="filter-group">
      <label for="location">Location:</label>
      <input
        type="text"
        id="location"
        [value]="filters.place_contains || ''"
        (change)="onLocationChange($event)"
        placeholder="e.g., 'California'"
      />
    </div>

    <div class="filter-group">
      <label for="magnitude-type">Magnitude Type:</label>
      <input
        type="text"
        id="magnitude-type"
        [value]="filters.magnitude_type || ''"
        (change)="onMagnitudeTypeChange($event)"
        placeholder="e.g., 'Mw'"
      />
    </div>
  </div>
  <div class="filter-actions">
    <button type="button" (click)="onLoadClick()" class="btn-load">Load Earthquakes</button>
    <button type="button" (click)="onClearClick()" class="btn-clear">Clear Filters</button>
  </div>
</div>
